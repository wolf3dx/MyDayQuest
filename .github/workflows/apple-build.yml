name: Apple build (macOS + iOS)

# GitHub используется ТОЛЬКО для сборок Apple (macOS/iOS) — основной репозиторий в GitLab.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apple:
    # macos-26 несёт Xcode 26.x, который требует свежий .NET-SDK для iOS/MacCatalyst (26.5)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode info (use runner default)
        run: |
          # Раннер по умолчанию уже указывает на полный Xcode_26.6.app (с macOS SDK);
          # переопределять НЕ нужно (Xcode_26.6.0.app битый — без macOS SDK).
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Build MacCatalyst (.app, unsigned)
        run: >
          dotnet publish Source/MyDayQuest/MyDayQuest.csproj
          -f net10.0-maccatalyst -c Release
          -p:CreatePackage=false -p:EnableCodeSigning=false
          -o artifacts/maccatalyst

      - name: Package MacCatalyst .app
        run: |
          cd artifacts/maccatalyst
          APP=$(ls -d *.app | head -1)
          if [ -n "$APP" ]; then
            zip -ry ../MyDayQuest-macos.zip "$APP"
          fi

      - name: Build iOS (simulator, unsigned)
        run: >
          dotnet build Source/MyDayQuest/MyDayQuest.csproj
          -f net10.0-ios -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -o artifacts/ios

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: |
            artifacts/MyDayQuest-macos.zip
            artifacts/ios/**/*.app
          if-no-files-found: warn
