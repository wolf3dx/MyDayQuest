name: Apple build (macOS + iOS)

# GitHub используется ТОЛЬКО для сборок Apple (macOS/iOS) — основной репозиторий в GitLab.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apple:
    # macos-26 несёт Xcode 26.x, который требует свежий .NET-SDK для iOS/MacCatalyst (26.5)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET для MacCatalyst/iOS жёстко требует Xcode не ниже своего: SDK 27.0 хочет
      # Xcode 27. Берём самый свежий установленный Xcode, у которого на месте macOS SDK
      # (встречаются «обрезанные» сборки вроде Xcode_26.6.0.app — без SDK, их пропускаем).
      # Apple-SDK требует РОВНО свою версию Xcode, а не «не ниже»: .NET для
      # MacCatalyst 26.0 работает только с Xcode 26.0. Поэтому выбираем точную
      # версию под закреплённый TFM net10.0-*26.0, а не самую свежую.
      - name: Select Xcode 26.0 (под Apple SDK 26.0)
        run: |
          echo "Установленные Xcode:"
          ls -d /Applications/Xcode*.app
          PICKED=""
          for APP in /Applications/Xcode_26.0.app /Applications/Xcode_26.0.1.app; do
            if [ -x "$APP/Contents/Developer/usr/bin/xcodebuild" ]                && DEVELOPER_DIR="$APP/Contents/Developer" xcrun --sdk macosx --show-sdk-path >/dev/null 2>&1; then
              PICKED="$APP"
              break
            fi
            echo "пропускаю $APP — нет или без macOS SDK"
          done
          if [ -z "$PICKED" ]; then echo "Xcode 26.0 на раннере не найден"; exit 1; fi
          echo "Выбран: $PICKED"
          sudo xcode-select -s "$PICKED/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      # Базовое правило 9: обе архитектуры — x64 и ARM64 (Apple Silicon).
      - name: Build MacCatalyst x64 (.app, unsigned)
        run: >
          dotnet publish Source/MyDayQuest/MyDayQuest.csproj
          -f net10.0-maccatalyst26.0 -c Release
          -p:RuntimeIdentifier=maccatalyst-x64
          -p:CreatePackage=false -p:EnableCodeSigning=false
          -o artifacts/maccatalyst-x64

      - name: Build MacCatalyst ARM64 (.app, unsigned)
        run: >
          dotnet publish Source/MyDayQuest/MyDayQuest.csproj
          -f net10.0-maccatalyst26.0 -c Release
          -p:RuntimeIdentifier=maccatalyst-arm64
          -p:CreatePackage=false -p:EnableCodeSigning=false
          -o artifacts/maccatalyst-arm64

      - name: Package MacCatalyst .app
        run: |
          for ARCH in x64 arm64; do
            DIR="artifacts/maccatalyst-$ARCH"
            APP=$(ls -d "$DIR"/*.app 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              (cd "$DIR" && zip -qry "../MyDayQuest-macos-$ARCH.zip" "$(basename "$APP")")
              echo "macOS $ARCH: готов"
            else
              echo "macOS $ARCH: .app не найден"; exit 1
            fi
          done

      - name: Build iOS device (unsigned) and package IPA for AltStore
        run: |
          dotnet build Source/MyDayQuest/MyDayQuest.csproj \
            -f net10.0-ios26.0 -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignRequired=false -p:EnableCodeSigning=false \
            -o artifacts/ios
          APP=$(find artifacts/ios -maxdepth 2 -name "*.app" -type d | head -1)
          echo "iOS .app: $APP"
          if [ -n "$APP" ]; then
            rm -rf artifacts/Payload
            mkdir -p artifacts/Payload
            cp -R "$APP" artifacts/Payload/
            (cd artifacts && zip -qry MyDayQuest-ios-unsigned.ipa Payload)
            echo "IPA готов:"; ls -la artifacts/MyDayQuest-ios-unsigned.ipa
          else
            echo "iOS .app не найден"; exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: |
            artifacts/MyDayQuest-macos-x64.zip
            artifacts/MyDayQuest-macos-arm64.zip
            artifacts/MyDayQuest-ios-unsigned.ipa
          if-no-files-found: warn
